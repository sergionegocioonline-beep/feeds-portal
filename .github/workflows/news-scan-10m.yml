name: news-scan-10m

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore scanner state cache
        uses: actions/cache@v4
        with:
          path: .state/news-scan-state.json
          key: news-scan-state-v1
          restore-keys: |
            news-scan-state-v1

      - name: Run 10-minute scan
        env:
          NEWS_FEED_URL: ${{ vars.NEWS_FEED_URL }}
          NEWS_SCAN_WINDOW_MINUTES: "10"
          NEWS_SCAN_STATE_PATH: ".state/news-scan-state.json"
          NEWS_SCAN_OUTPUT_DIR: "news-handoff"
        run: |
          python automation/news_scan.py

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: news-scan-report
          path: |
            news-handoff/scan_report.json
            news-handoff/new_items.json
            news-handoff/new_items.md
          if-no-files-found: error
